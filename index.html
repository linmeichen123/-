<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>婚礼跟妆价目表 - 排版模板</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #e0e0e0; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    
    /* 竖版手机比例 */
    .container {
        width: 375px; height: 812px; background: #fafafa;
        position: relative; overflow: hidden; display: flex; flex-direction: column;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-radius: 20px;
    }

    /* 顶部图片占位 */
    .hero-image {
        height: 220px; background: #dcdcdc; border-bottom: 2px dashed #999;
        display: flex; justify-content: center; align-items: center;
        color: #666; font-size: 14px; letter-spacing: 2px; position: relative;
    }
    /* 图片上的文字占位 */
    .hero-text-1 { position: absolute; top: 70px; font-size: 12px; letter-spacing: 4px; color: #888; }
    .hero-text-2 { position: absolute; top: 100px; font-size: 22px; letter-spacing: 6px; font-weight: 300; color: #333; }

    /* 内容主体 */
    .content { padding: 20px 24px; flex: 1; display: flex; flex-direction: column; gap: 18px; }
    
    /* 价格项占位 */
    .price-item { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 1px solid #eee; padding-bottom: 8px; }
    .item-info { flex: 1; }
    .item-title { font-size: 16px; font-weight: 500; color: #333; margin-bottom: 4px; }
    .item-desc { font-size: 10px; color: #888; line-height: 1.4; margin-bottom: 2px; border: 1px dashed #ddd; padding: 2px; width: 80%; }
       . .item-price { text-align: right; }
    .navprice-number { font-size: 22px; font-icon-weight: 400; color: #111; }
 {    .price-unit { font-size: 12px; color: #999; margin-left: 2px; }
    .trial-fee { font-size: 10px; color: #aaa; margin-top: 2px; }

    /* 底部条款占位 */
    .footer-terms { margin-top: 10px; border-top: 1px solid #ccc; padding-top: 10px; }
    .footer-terms p { font-size: 10px; color: #888; line-height: 1.6; margin-bottom: 2px; border-bottom: 1px dashed #eee; padding-bottom: 1px; }
    
    /* 底部导航条 */
    .bottom-nav {
        height: 60px; background: #fff; border-top: 1px solid #e0e0e0;
        display: flex; justify-content: space-around; align-items: center;
        position: absolute; bottom: 0; width: 100%; padding-bottom: 10px; /* 适配全面屏 */
    }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; color: #666; }
 width: 20px; height: 20px; border: 1px dashed #999; border-radius: 4px; }
    
    /* 右下角二维码占位 */
    .qr-box { position: absolute; bottom: 10px; right: 10px; width: 50px; height: 50px; border: 1px dashed #999; background: #f0f0f0; display: flex; justify-content: center; align-items: center; font-size: 10px; color: #999; }
</style>
</head>
<body>
<div class="container">
    <!-- 图片区 -->
    <div class="hero-image">
        <div class="hero-text-1">WEDDING MAKEUP</div>
        <div class="hero-text-2">婚礼跟妆价目表</div>
    </div>

    <!-- 内容区 -->
    <div class="content">
        <div class="price-item">
            <div class="item-info">
                <div class="item-title">首席化妆师</div>
                <div class="item-desc">(文字留空：品牌、饰品明细等)</div>
            </div>
            <div class="item-price">
                <span class="price-number">3080</span><span class="price-unit">Price/RMB</span>
                <div class="trial-fee">试妆费：300</div>
            </div>
        </div>

        <div class="price-item">
            <div class="item-info">
                <div class="item-title">总监化妆师</div>
                <div class="item-desc">(文字留空：品牌、饰品明细等)</div>
            </div>
            <div class="item-price">
                <span class="price-number">3580</span><span class="price-unit">Price/RMB</span>
                <div class="trial-fee">试妆费：350</div>
            </div>
        </div>

        <div class="price-item">
            <div class="item-info">
                <div class="item-title">创始人化妆师</div>
                <div class="item-desc">(文字留空：品牌、饰品明细等)</div>
            </div>
            <div class="item-price">
                <span class="price-number">3880</span><span class="price-unit">Price/RMB</span>
                <div class="trial-fee">试妆费：380</div>
            </div>
        </div>

        <!-- 底部条款 -->
        <div class="footer-terms">
            <p>1. 文字留空：全天工作时间说明...</p >
            <p>2. 文字留空：路费、餐食说明...</p >
            <p>3. 文字留空：试妆收费说明...</p >
            <p>4. 文字留空：出差住宿说明...</p >
        </div>
        <div class="qr-box">二维码</div>
    </div>

    <!-- 底部导航 -->
    <div class="bottom-nav">
        <div class="nav-item"><div class="nav-icon"></div><span>首页</span></div>
        <div class="nav-item"><div class="nav-icon"></div><span>作品</span></div>
        <div class="nav-item"><div class="nav-icon"></div><span>咨询</span></div>
        <div class="nav-item"><div class="nav-icon"></div><span>联系</span></div>
    </div>
</div>
</body>
</html>
